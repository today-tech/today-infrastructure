plugins {
  id 'java-gradle-plugin'
}

repositories {
  mavenLocal()
  maven { url = "https://central.sonatype.com/repository/maven-snapshots/" }
  mavenCentral()
  gradlePluginPortal()
}

Properties properties = new Properties()

try (def reader = new FileReader(file("../../gradle.properties"))) {
  properties.load(reader)
}

def infraVersion = properties['version']

dependencies {
  implementation(platform("cn.infra-tech:infra-bom:$infraVersion"))
  implementation "cn.infra-tech:infra-core"
  implementation "cn.infra-tech:infra-gradle-plugin"
}
